<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="8" fill="#0E1013"/>
  <!-- Football shape: brown oval -->
  <ellipse cx="16" cy="16" rx="10" ry="7" fill="#7B4F2E" rx="10"/>
  <!-- Laces (white vertical bar) -->
  <rect x="14.5" y="11" width="3" height="10" rx="1" fill="#F2F2E8"/>
  <!-- Lace stitches -->
  <rect x="14" y="13" width="4" height="1" rx="0.5" fill="#0E1013"/>
  <rect x="14" y="15.5" width="4" height="1" rx="0.5" fill="#0E1013"/>
  <rect x="14" y="18" width="4" height="1" rx="0.5" fill="#0E1013"/>
  <!-- Blue glow dot top-right -->
  <circle cx="26" cy="6" r="3" fill="#6A85FA" opacity="0.9"/>
</svg>