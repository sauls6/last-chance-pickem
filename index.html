<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Viewport: viewport-fit=cover for iPhone notch/island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / Home Screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pick'Em" />
    <meta name="theme-color" content="#050505" />

    <!-- Open Graph (link preview in iMessage / Discord / WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Last Chance Pick'Em 🏈" />
    <meta property="og:description" content="Pick the winners of all 6 weekly fantasy matchups in our 12-team Sleeper league." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Last Chance Pick'Em 🏈" />
    <meta name="twitter:description" content="Pick all 6 weekly fantasy matchups. Compete on the leaderboard." />

    <title>Last Chance Fantasy Pick 'Em</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#050505] text-[#F2F2E8] font-sans antialiased selection:bg-[#6A85FA] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
